schema: '1.0'
version: 1.2.0

project:
  type: web_fullstack
  name: komari-theme-farmer
  description: Pixel-art farm theme for Komari based on komari-theme-Neko UI
  base: komari-theme-Neko

references:
  mode: merge
  items:
    - architecture
    - testing
    - devops
    - security
    - farmer-visual-style

themes:
  color_palette_options:
    - sunrise
    - emerald
    - farmer

  visual_style:
    default: farmer
    allowed:
      - farmer
      - baseline
    storage_keys:
      explicit: komaritheme:theme
      default: komaritheme:theme-default
